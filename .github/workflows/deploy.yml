name: Release Extension

on:
  push:
    tags:
      - 'v*' # Trigger this workflow when a new tag like v1.0.0 is pushed

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Check Version Match and Create Release Zip
        id: build_zip
        run: |
          # Extract version from manifest.json using jq
          VERSION=$(jq -r '.version' manifest.json)
          
          # Validate that the tag version matches the manifest version
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Error: Tag version ($GITHUB_REF_NAME) does not match manifest version (v$VERSION)"
            exit 1
          fi
          
          ZIP_NAME="NeuroTab-v${VERSION}.zip"
          echo "Version match confirmed! Creating $ZIP_NAME..."
          
          # Pass the zip name to the next step
          echo "zip_name=$ZIP_NAME" >> $GITHUB_OUTPUT
          
          # Create zip excluding dev files
          zip -r $ZIP_NAME . -x "*.git*" -x "*.github*" -x "*.agents*" -x "*.vscode*" -x "node_modules/*" -x "*.zip"
          
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.build_zip.outputs.zip_name }}
          generate_release_notes: true