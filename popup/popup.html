<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=400">
  <title>NeuroTab</title>
  <link rel="stylesheet" href="popup.css?v=2">
</head>

<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <img src="../icons/icon48.svg" width="24" height="24" alt="NeuroTab Logo" />
        <span class="logo-text">NeuroTab</span>
      </div>
      <div style="display: flex; align-items: center; gap: 10px;">
        <div class="streak-counter" id="streakCounter" title="Current Focus Streak (Days)"
          style="display: flex; align-items: center; gap: 4px; font-weight: bold; color: #ff9800; font-size: 14px; background: rgba(255, 152, 0, 0.1); padding: 4px 8px; border-radius: 12px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" stroke="none">
            <path d="M12 2c0 0-5 6-5 11 0 4.418 5 9 5 9s5-4.582 5-9c0-5-5-11-5-11z" />
          </svg>
          <span id="streakValue">0</span>
        </div>
        <button class="settings-btn" id="settingsBtn" title="Settings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3" />
            <path
              d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" />
          </svg>
        </button>
      </div>
    </header>

    <!-- Mode Toggle -->
    <section class="mode-section">
      <div class="mode-toggle" id="modeToggle">
        <button class="mode-btn active" data-mode="normal">
          <span class="mode-icon">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z" />
              <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12" />
            </svg>
          </span>
          <span class="mode-label">Normal</span>
        </button>
        <button class="mode-btn" data-mode="productivity">
          <span class="mode-icon">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z" />
              <path
                d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z" />
              <path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0" />
              <path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5" />
            </svg>
          </span>
          <span class="mode-label">Focus</span>
        </button>
        <button class="mode-btn" data-mode="exam">
          <span class="mode-icon">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="m4 11.5 8 5 8-5" />
              <path d="M12 2 2 8l10 6 10-6-10-6Z" />
              <path d="M22 10v6" />
              <path d="M6 12.5V18a6 3 0 0 0 12 0v-5.5" />
            </svg>
          </span>
          <span class="mode-label">Exam</span>
        </button>
        <div class="mode-slider"></div>
      </div>
    </section>

    <!-- Current Site Card -->
    <section class="current-site-card" id="currentSiteCard">
      <div class="site-info">
        <img class="site-favicon" id="siteFavicon" src="" alt="">
        <div class="site-details">
          <span class="site-domain" id="siteDomain">Loading...</span>
          <span class="site-category" id="siteCategory">—</span>
        </div>
      </div>
      <div class="site-time">
        <span class="time-value" id="siteTime">0m</span>
        <span class="time-label">today</span>
      </div>
    </section>

    <!-- Focus Session -->
    <section class="focus-section" id="focusSection">
      <!-- Inactive State -->
      <div class="focus-inactive" id="focusInactive">
        <h3 class="focus-title">Start Focus Session</h3>
        <div class="duration-selector">
          <button class="duration-btn" data-duration="15">15m</button>
          <button class="duration-btn active" data-duration="25">25m</button>
          <button class="duration-btn" data-duration="45">45m</button>
          <button class="duration-btn" data-duration="60">1h</button>
        </div>
        <button class="start-focus-btn" id="startFocusBtn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="5,3 19,12 5,21" />
          </svg>
          Start Focus
        </button>
      </div>

      <!-- Active State -->
      <div class="focus-active hidden" id="focusActive">
        <div class="focus-timer">
          <svg class="timer-ring" viewBox="0 0 100 100">
            <circle class="timer-bg" cx="50" cy="50" r="45" />
            <circle class="timer-progress" id="timerProgress" cx="50" cy="50" r="45" />
          </svg>
          <div class="timer-display">
            <span class="timer-time" id="timerTime">25:00</span>
            <span class="timer-label">remaining</span>
          </div>
        </div>
        <div class="focus-stats">
          <div class="focus-stat">
            <span class="stat-value" id="distractionCount">0</span>
            <span class="stat-label">distractions</span>
          </div>
        </div>
        <button class="end-focus-btn" id="endFocusBtn">End Session</button>
      </div>
    </section>

    <!-- EXAM Session -->
    <section class="exam-section hidden" id="examSection">
      <!-- Inactive State -->
      <div class="exam-inactive" id="examInactive">
        <h3 class="exam-title">Start Exam Mode</h3>
        <p class="exam-desc"
          style="font-size: 13px; color: var(--text-color); margin-bottom: 20px; text-align: center;">Select a tab to
          lock into a strict exam environment.</p>

        <div class="exam-tab-selector" style="margin-bottom: 16px; position: relative;">
          <select id="examTabSelect" class="exam-select"
            style="width: 100%; padding: 10px 32px 10px 12px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 13px; appearance: none; cursor: pointer; outline: none; transition: border-color 0.2s;">
            <option value="">Select a tab to lock...</option>
          </select>
          <div
            style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--text-muted); font-size: 10px;">
            ▼
          </div>
        </div>

        <div class="duration-selector">
          <button class="exam-duration-btn duration-btn active" data-duration="60">60m</button>
          <button class="exam-duration-btn duration-btn" data-duration="90">90m</button>
          <button class="exam-duration-btn duration-btn" data-duration="120">120m</button>
        </div>

        <button class="start-exam-btn" id="startExamBtn" disabled>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="5,3 19,12 5,21" />
          </svg>
          Start Exam
        </button>
      </div>

      <!-- Active State -->
      <div class="exam-active hidden" id="examActive">
        <div class="exam-status"
          style="display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 20px;">
          <svg class="exam-icon" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--danger)"
            stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <span class="exam-label" style="font-weight: bold; color: var(--danger);">Exam in Progress</span>
        </div>
        <div class="exam-timer focus-timer" style="margin-bottom: 20px;">
          <svg class="timer-ring" viewBox="0 0 100 100">
            <circle class="timer-bg" cx="50" cy="50" r="45" />
            <circle class="timer-progress" id="examTimerProgress" cx="50" cy="50" r="45" />
          </svg>
          <div class="timer-display">
            <span class="timer-time" id="examTimerTime">60:00</span>
            <span class="timer-label">remaining</span>
          </div>
        </div>
        <button class="end-exam-btn" id="endExamBtn"
          style="width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--danger); background: transparent; color: var(--danger); font-weight: 600; cursor: pointer;">Force
          Quit Exam</button>
      </div>
    </section>

    <!-- Today's Summary -->
    <section class="summary-section">
      <h3 class="section-title">Today's Activity</h3>
      <div class="summary-stats">
        <div class="summary-stat">
          <div class="stat-circle productive">
            <span id="productiveTime">0m</span>
          </div>
          <span class="stat-name">Productive</span>
        </div>
        <div class="summary-stat">
          <div class="stat-circle total">
            <span id="totalTime">0m</span>
          </div>
          <span class="stat-name">Total</span>
        </div>
        <div class="summary-stat">
          <div class="stat-circle distracting">
            <span id="distractingTime">0m</span>
          </div>
          <span class="stat-name">Distracting</span>
        </div>
      </div>
    </section>

    <!-- Dashboard Link -->
    <footer class="footer">
      <button class="dashboard-link" id="dashboardBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="9" />
          <rect x="14" y="3" width="7" height="5" />
          <rect x="14" y="12" width="7" height="9" />
          <rect x="3" y="16" width="7" height="5" />
        </svg>
        Open Dashboard
      </button>
    </footer>
  </div>

  <script src="popup.js" type="module"></script>
</body>

</html>
