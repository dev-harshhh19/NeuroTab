<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Site Blocked - NeuroTab</title>
  <link rel="stylesheet" href="blocked.css">
</head>

<body>
  <div class="blocked-container">
    <!-- Background Animation -->
    <div class="bg-gradient"></div>
    <div class="bg-pattern"></div>

    <!-- Main Content -->
    <div class="content">
      <!-- Icon -->
      <div class="icon-wrapper">
        <div class="icon-circle">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10" />
            <line x1="4.93" y1="4.93" x2="19.07" y2="19.07" />
          </svg>
        </div>
      </div>

      <!-- Message -->
      <h1 class="title">This site is blocked</h1>
      <p class="subtitle" id="reasonText">Stay focused on what matters</p>

      <!-- Blocked Domain -->
      <div class="domain-card">
        <span class="domain-label">Blocked site</span>
        <span class="domain-name" id="domainName">example.com</span>
      </div>

      <!-- Timer / Info -->
      <div class="info-section" id="infoSection">
        <!-- Dynamic content based on block reason -->
      </div>

      <!-- Focus Session Progress (if active) -->
      <div class="focus-progress hidden" id="focusProgress">
        <h3 class="progress-title">Focus Session Active</h3>
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="progress-stats">
          <span id="progressTime">25:00</span>
          <span>remaining</span>
        </div>
      </div>

      <!-- Actions -->
      <div class="actions">
        <button class="btn btn-primary" id="goBackBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="19" y1="12" x2="5" y2="12" />
            <polyline points="12,19 5,12 12,5" />
          </svg>
          Go Back
        </button>
      </div>

      <!-- Motivational Quote -->
      <div class="quote">
        <p id="quoteText">"Focus is saying no to a hundred good ideas."</p>
        <span id="quoteAuthor">— Steve Jobs</span>
      </div>
    </div>

    <!-- Branding -->
    <footer class="footer">
      <div class="logo">
        <img src="../icons/icon48.svg" width="20" height="20" alt="NeuroTab Logo" />
        <span>NeuroTab</span>
      </div>
    </footer>
  </div>

  <script src="blocked.js" type="module"></script>
</body>

</html>
